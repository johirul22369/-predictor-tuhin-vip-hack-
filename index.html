        /* ১. ফিমেল ভয়েস মডিউল */
        const VoiceModule = (() => {
            const queue = [];
            let speaking = false;
            let selectedVoice = null;

            function pickVoice() {
                if (!("speechSynthesis" in window)) return null;
                const list = window.speechSynthesis.getVoices() || [];
                if (!list.length) return null;

                const maleRe = /\b(male|man|boy|rishi|prabhat|amit|arjun|david|mark|alex|daniel|george|ryan|thomas|eric|brian|fred|albert)\b/i;
                const femaleRe = /(female|woman|girl|lady|tanisha|nabila|priya|lekha|aditi|raveena|sangeeta|kalpana|zira|samantha|victoria|moira|fiona|veena|aria|jenny|allison|ava|zoe|karen|tessa|google.*(female|hindi|bn)|microsoft.*(tanisha|aria|jenny|zira))/i;

                const females = list.filter((v) => !maleRe.test(v.name) && femaleRe.test(v.name));
                return (
                    females.find((v) => /bn|bangla|bengali/i.test(v.lang) || /bn|bangla|bengali/i.test(v.name)) ||
                    females.find((v) => /hi|en-in|en-gb|en-us/i.test(v.lang)) ||
                    females[0] ||
                    list.filter((v) => !maleRe.test(v.name))[0] ||
                    null
                );
            }

            function drain() {
                if (speaking || !AppState.voiceEnabled || !("speechSynthesis" in window)) return;
                const text = queue.shift();
                if (!text) return;

                speaking = true;
                if (!selectedVoice) selectedVoice = pickVoice();

                const utter = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utter.voice = selectedVoice;
                utter.lang = "bn-BD";
                utter.pitch = 1.78;
                utter.rate = 0.94;
                utter.volume = 1;

                let done = false;
                const finish = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(guard);
                    speaking = false;
                    setTimeout(drain, 180);
                };

                const guard = setTimeout(finish, 5500);
                utter.onend = finish;
                utter.onerror = finish;

                try {
                    window.speechSynthesis.speak(utter);
                } catch (_) {
                    finish();
                }
            }

            function say(text) {
                if (!AppState.voiceEnabled || !("speechSynthesis" in window) || !text) return;
                const clean = String(text).trim();
                if (!clean || queue[queue.length - 1] === clean) return;
                queue.push(clean);
                drain();
            }

            function syncButton() {

                syncButton();
                if (!AppState.voiceEnabled) {
                    queue.length = 0;
                    speaking = false;

                } else {
                    say("সবাই এখানে একটা বিগ ট্রেড করো!");
                }
            }

            if ("speechSynthesis" in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    selectedVoice = pickVoice();
                };
            }

            return { say, toggle, syncButton };
        })();

        /* ২. আইকন লিংক মডিউল */

        /* ৩. প্ল্যাটফর্ম ও ইউআই মডিউল */
        const PlatformModule = (() => {

        const UIModule = (() => {
            function showPopup() {
                document.getElementById("main-content").style.display = "block";
                document.getElementById("floating-icon-btn").style.display = "none";
            }

            function hidePopup() {
                document.getElementById("main-content").style.display = "none";
                document.getElementById("floating-icon-btn").style.display = "flex";
                VoiceModule.say("প্যানেল হাইড করা হলো।");
            }

            function bindDrag(targetEl, handleEl, onSingleTap, onDoubleTap) {
                let down = false, moved = false, sx = 0, sy = 0, oLeft = 0, oTop = 0, lastTap = 0;

                function start(x, y) {
                    const rect = targetEl.getBoundingClientRect();
                    oLeft = rect.left;
                    oTop = rect.top;
                    sx = x;
                    sy = y;
                    down = true;
                    moved = false;
                    targetEl.style.left = `${oLeft}px`;
                    targetEl.style.top = `${oTop}px`;
                    targetEl.style.right = "auto";
                    targetEl.style.bottom = "auto";
                    targetEl.style.transform = "none";
                }

                function move(x, y) {
                    if (!down) return;
                    const dx = x - sx, dy = y - sy;
                    if (Math.hypot(dx, dy) > 6) moved = true;
                    const maxL = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
                    const maxT = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
                    targetEl.style.left = `${Math.max(4, Math.min(maxL, oLeft + dx))}px`;
                    targetEl.style.top = `${Math.max(4, Math.min(maxT, oTop + dy))}px`;
                }

                function end() {
                    if (!down) return;
                    down = false;
                    if (moved) return;
                    const now = Date.now();
                    if (typeof onDoubleTap === "function" && now - lastTap < 320) {
                        lastTap = 0;
                        onDoubleTap();
                    } else {
                        lastTap = now;
                        if (typeof onSingleTap === "function") onSingleTap();
                    }
                }

                handleEl.addEventListener("touchstart", (e) => {
                    if (e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                    if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: true });

                handleEl.addEventListener("touchmove", (e) => {
                    if (!down || e.touches.length !== 1) return;
                    e.preventDefault();
                    move(e.touches[0].clientX, e.touches[0].clientY);
                }, { passive: false });

                handleEl.addEventListener("touchend", end);
                handleEl.addEventListener("touchcancel", end);

                handleEl.addEventListener("mousedown", (e) => {
                    if (e.button !== 0 || e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                    start(e.clientX, e.clientY);
                    function mm(ev) { move(ev.clientX, ev.clientY); }
                    function mu() {
                        document.removeEventListener("mousemove", mm);
                        document.removeEventListener("mouseup", mu);
                        end();
                    }
                    document.addEventListener("mousemove", mm);
                    document.addEventListener("mouseup", mu);
                });
            }

            return { showPopup, hidePopup, bindDrag };
        })();

        /* ৪. অথ মডিউল */
        const AuthModule = (() => {

        /* ৫. সিগন্যাল ও পিরিয়ড মডিউল */
        const SignalModule = (() => {
            function mixHash(seed) {
                let x = seed >>> 0;
                x ^= x >>> 16;
                x = Math.imul(x, 0x7feb352d) >>> 0;
                x ^= x >>> 15;
                x = Math.imul(x, 0x846ca68b) >>> 0;
                x ^= x >>> 16;
                return x >>> 0;
            }

            function effectiveSalt(cfg) {
                return (cfg.salt ^ (CONFIG.platforms[AppState.platform]?.saltMix || 0)) >>> 0;
            }

            function colorMeta(num) {
                if (num === 0) return { orbClass: "orb-violet", ballClass: "b-violet-red", colorName: "VIOLET+RED" };
                if (num === 5) return { orbClass: "orb-violet", ballClass: "b-violet-green", colorName: "VIOLET+GRN" };
                if ([1, 3, 7, 9].includes(num)) return { orbClass: "orb-green", ballClass: "b-green", colorName: "GREEN" };
                return { orbClass: "orb-red", ballClass: "b-red", colorName: "RED" };
            }

            function rawNum(slotNum, cfg, dateSeed) {
                const salt = effectiveSalt(cfg);
                const h1 = mixHash((dateSeed ^ Math.imul(slotNum, salt)) >>> 0);
                const h2 = mixHash(h1 ^ (slotNum * 2654435761));
                const type = (h1 % 100) >= 50 ? "BIG" : "SMALL";
                const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                return pool[h2 % pool.length];
            }

            function evaluate(slotNum, cfg, dateSeed) {
                const salt = effectiveSalt(cfg);
                const h1 = mixHash((dateSeed ^ Math.imul(slotNum, salt)) >>> 0);
                const h2 = mixHash(h1 ^ (slotNum * 2654435761));

                let streakType = null, streak = 0, bigCount = 0;
                for (let lb = 1; lb <= 5; lb++) {
                    const idx = Math.max(1, slotNum - lb);
                    const isBig = (mixHash((dateSeed ^ Math.imul(idx, salt)) >>> 0) % 100) >= 49;
                    if (isBig) bigCount++;
                    if (lb === 1) {
                        streakType = isBig ? "BIG" : "SMALL";
                        streak = 1;
                    } else if (((isBig ? "BIG" : "SMALL") === streakType) && streak === lb - 1) {
                        streak++;
                    }
                }

                let score = h1 % 100;
                if (streakType === "BIG" && streak >= 3) score -= 18;
                else if (streakType === "SMALL" && streak >= 3) score += 18;
                if (bigCount >= 4) score -= 10;
                if (bigCount <= 1) score += 10;

                const type = score >= 50 ? "BIG" : "SMALL";
                const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
                const pick = h2 % pool.length;
                let num = pool[pick];
                if (slotNum > 1 && num === rawNum(slotNum - 1, cfg, dateSeed)) {
                    num = pool[(pick + 1) % pool.length];
                }

                const confidence = Math.min(94, Math.max(76, 78 + Math.floor(Math.abs(score - 50) * 0.65) + (h2 % 6)));
                return { type, num, confidence, ...colorMeta(num) };
            }

            function checkPrevWin(slotNum, cfg, dateSeed, prev) {
                const h = mixHash((dateSeed ^ Math.imul(slotNum, effectiveSalt(cfg)) ^ 0x517CC1B7) >>> 0);
                return (prev.type === "BIG") === ((h % 100) >= 50);
            }

            function renderHistory(cfg, periodIndexToday, dateSeed) {
                const wrap = document.getElementById("recent-wheels");
                wrap.innerHTML = "";
                for (let i = 9; i >= 0; i--) {
                    const sig = evaluate(Math.max(1, periodIndexToday - i), cfg, dateSeed);
                    const ball = document.createElement("div");
                    ball.className = `mini-ball text-3d ${sig.ballClass}`;
                    ball.textContent = String(sig.num);
                    wrap.appendChild(ball);
                }
            }

            function recordWin() {
                AppState.wins++;
                document.getElementById("wl-status").textContent = `W: ${AppState.wins} | L: ${AppState.losses}`;
                document.getElementById("ai-call-banner").textContent = "👩 অভিনন্দন! এই ট্রেড উইন হয়েছে!";
                VoiceModule.say("অভিনন্দন! এই ট্রেড উইন হয়েছে!");
            }

            function recordLoss() {
                AppState.losses++;
                document.getElementById("wl-status").textContent = `W: ${AppState.wins} | L: ${AppState.losses}`;
                document.getElementById("ai-call-banner").textContent = "👩 দুঃখিত, এই ট্রেড লস হয়েছে!";
                VoiceModule.say("দুঃখিত, এই ট্রেড লস হয়েছে!");
            }

            function copyPeriod() {
                const txt = document.getElementById("period-num").innerText.trim();
                if (!txt || txt === "Loading...") return;
                navigator.clipboard.writeText(txt).then(() => {
                    const toast = document.getElementById("copy-toast");
                    toast.style.display = "block";
                    setTimeout(() => { toast.style.display = "none"; }, 1200);
                    VoiceModule.say("পিরিয়ড নম্বর কপি হয়েছে।");
                }).catch(() => {});
            }

            function tick() {
                if (!AppState.unlocked) return;
                const cfg = CONFIG.markets[AppState.market] || CONFIG.markets["30S"];
                const now = new Date();
                const sec = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
                const periodIndexToday = Math.floor(sec / cfg.duration) + 1;
                const elapsed = sec % cfg.duration;
                const timeLeft = cfg.duration - elapsed;

                const dateStr = `${now.getUTCFullYear()}${String(now.getUTCMonth() + 1).padStart(2, "0")}${String(now.getUTCDate()).padStart(2, "0")}`;
                const dateSeed = parseInt(dateStr, 10) || 20261122;
                const fullPeriod = `${dateStr}1000${String(cfg.offset + periodIndexToday).padStart(5, "0")}`;

                document.getElementById("period-num").innerText = fullPeriod;
                document.getElementById("timer-display").innerText = `${String(timeLeft).padStart(2, "0")}s`;

                let changed = false;
                let outcomeMsg = "";

                if (fullPeriod !== AppState.cachedPeriod) {
                    if (AppState.cachedPeriod && AppState.prevPrediction && periodIndexToday > 1) {
                        const won = checkPrevWin(periodIndexToday - 1, cfg, dateSeed, AppState.prevPrediction);
                        if (won) {
                            AppState.wins++;
                            outcomeMsg = "অভিনন্দন! আগের ট্রেড উইন হয়েছে!";
                        } else {
                            AppState.losses++;
                            outcomeMsg = "দুঃখিত, আগের ট্রেড লস হয়েছে!";
                        }
                        document.getElementById("wl-status").textContent = `W: ${AppState.wins} | L: ${AppState.losses}`;
                    }
                    AppState.cachedPeriod = fullPeriod;
                    AppState.prediction = evaluate(periodIndexToday, cfg, dateSeed);
                    AppState.prevPrediction = { ...AppState.prediction };
                    changed = true;
                }

                const orb = document.getElementById("main-orb");
                const orbText = document.getElementById("main-orb-text");
                const bigPanel = document.getElementById("big-panel");
                const smallPanel = document.getElementById("small-panel");
                const bigTag = document.getElementById("big-tag");
                const smallTag = document.getElementById("small-tag");

                if (elapsed <= 2) {
                    orbText.innerText = "...";
                    orb.className = "num-orb orb-violet text-3d";
                    document.getElementById("color-label").innerText = "SCANNING";
                    document.getElementById("conf-label").innerText = "SYNC...";
                    document.getElementById("ai-call-banner").textContent = outcomeMsg ? `👩 ${outcomeMsg}` : "👩 সিগন্যাল স্ক্যান হচ্ছে...";
                    bigPanel.classList.remove("is-active");
                    smallPanel.classList.remove("is-active");
                    bigTag.innerText = "WAIT";
                    smallTag.innerText = "WAIT";
                    bigTag.className = "rgb-tag text-3d";
                    smallTag.className = "rgb-tag text-3d";
                } else {
                    const p = AppState.prediction;
                    const callLine = p.type === "BIG" ? "সবাই এখানে একটা বিগ ট্রেড করো!" : "সবাই এখানে একটা স্মল ট্রেড করো!";
                    orbText.innerText = String(p.num);
                    orb.className = `num-orb ${p.orbClass} text-3d`;
                    document.getElementById("color-label").innerText = p.colorName;
                    document.getElementById("conf-label").innerText = `CONF ${p.confidence}%`;
                    document.getElementById("ai-call-banner").textContent = `👩 ${callLine}`;

                    const isBig = p.type === "BIG";
                    bigPanel.classList.toggle("is-active", isBig);
                    smallPanel.classList.toggle("is-active", !isBig);
                    bigTag.innerText = isBig ? "ACTIVE" : "SKIP";
                    smallTag.innerText = !isBig ? "ACTIVE" : "SKIP";
                    bigTag.className = `rgb-tag text-3d ${isBig ? "active" : ""}`;
                    smallTag.className = `rgb-tag text-3d ${!isBig ? "active" : ""}`;
                }

                if (changed && AppState.lastAnnouncedPeriod !== fullPeriod) {
                    AppState.lastAnnouncedPeriod = fullPeriod;
                    const p = AppState.prediction;
                    const callLine = p.type === "BIG" ? "সবাই এখানে একটা বিগ ট্রেড করো!" : "সবাই এখানে একটা স্মল ট্রেড করো!";
                    const numBn = CONFIG.banglaDigits[p.num] ?? p.num;
                    if (outcomeMsg) VoiceModule.say(outcomeMsg);
                    VoiceModule.say(`${callLine} নম্বর ${numBn}।`);
                }

                renderHistory(cfg, periodIndexToday, dateSeed);
            }

            function start() {
                tick();
                if (!AppState.timerStarted) {
                    AppState.timerStarted = true;
                    setInterval(tick, 1000);
                }
            }

            return { tick, start, recordWin, recordLoss, copyPeriod };
        })();

        /* ইনিশিয়ালাইজেশন */
        VoiceModule.syncButton();
        PlatformModule.refreshSubtitle();

        document.getElementById("pass-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") AuthModule.verify();
        });

        document.querySelectorAll(".time-tab-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".time-tab-btn").forEach((b) => b.classList.remove("active"));
                btn.classList.add("active");
                AppState.market = btn.dataset.market;
                PlatformModule.refreshSubtitle();
                AppState.cachedPeriod = "";
                AppState.lastAnnouncedPeriod = "";
                AppState.prevPrediction = null;
                SignalModule.tick();
                VoiceModule.say(`${CONFIG.markets[AppState.market].bnName} মার্কেট চালু হয়েছে।`);
            });
        });

        UIModule.bindDrag(
            document.getElementById("floating-icon-btn"),
            document.getElementById("floating-icon-btn"),
            IconLinkModule.onSingleTap,
            IconLinkModule.openCurrentPlatform
        );
        UIModule.bindDrag(
            document.getElementById("main-content"),
            document.getElementById("main-content-header"),
            null,
            null
        );
    </script>
</body>
</html>
